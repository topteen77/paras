services:
  canam-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: canam-assistant
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      PORT: 8080
    volumes:
      # GCP service account key (create from GCP Console → IAM → Service Accounts)
      - ./service_account_key.json:/app/service_account_key.json:ro
      # Persist uploaded Excel files during schedule-calls
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  ngrok:
    image: ngrok/ngrok:latest
    container_name: canam-ngrok
    restart: unless-stopped
    command:
      - "http"
      - "canam-assistant:8080"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      canam-assistant:
        condition: service_healthy
